<!DOCTYPE html>
<!-- Figma Community carousel 7 (1920×1080): closing. Render with `npm run listing`. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="listing.css">
  <style>
    .stage { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 56px; text-align: center; }
    .icon { width: 240px; height: 240px; filter: drop-shadow(0 30px 40px rgba(60, 30, 20, 0.18)); }
    h1 { font-size: 96px; }
    .lead { font-size: 34px; }
    .lead strong { color: var(--text); font-weight: 650; }
  </style>
</head>
<body>
  <div class="stage">
    <img class="icon" src="../../brand/kit/glass/glass-icon-light.svg" alt="">
    <h1>What you connect<br><span class="accent">stays connected.</span></h1>
    <p class="lead">Find <strong>Autoflow</strong> in Figma under Plugins.</p>
  </div>
</body>
</html>
